name: Parts Inventory
version: "1.5.0"
slug: parts_inventory
description: Photo-first inventory for all your parts. SQLite, search, linked items, AI photo identification.
url: https://github.com/dannyrwilson/Inventory
arch:
  - aarch64
  - amd64
init: true
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:package-variant-closed
panel_title: Inventory
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Direct access (optional; set a password if you enable this)
backup: hot
options:
  ai_provider: openai
  openai_api_key: ""
  anthropic_api_key: ""
  ai_model: ""
  auto_categorize: true
  password: ""
schema:
  ai_provider: list(openai|anthropic)
  openai_api_key: password?
  anthropic_api_key: password?
  ai_model: str?
  auto_categorize: bool
  password: password?
