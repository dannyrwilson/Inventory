<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventory · Sign in</title>
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#f2f2f7;--card:#fff;--text:#000;--sub:rgba(60,60,67,.6);--fill:rgba(120,120,128,.12)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#fff;--sub:rgba(235,235,245,.6);--fill:rgba(120,120,128,.24)}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:17px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
form{background:var(--card);padding:28px 22px;border-radius:18px;width:min(340px,90vw);text-align:center}
img{width:72px;height:72px;border-radius:16px}
h1{font-size:22px;margin:12px 0 4px}p{color:var(--sub);margin:0 0 18px;font-size:15px}
input{width:100%;box-sizing:border-box;border:0;background:var(--fill);border-radius:11px;padding:13px;font:inherit;color:inherit;outline:none}
button{margin-top:12px;width:100%;border:0;border-radius:12px;padding:13px;background:#0a84ff;color:#fff;font:600 17px inherit}
.bad{color:#ff3b30;font-size:14px;margin-top:10px;display:none}
</style></head><body>
<form method="post" action="login">
<img src="icons/icon-192.png" alt="">
<h1>Parts Inventory</h1><p>Enter the password set in the add-on</p>
<input type="password" name="password" autofocus autocomplete="current-password" placeholder="Password">
<button>Sign in</button>
<div class="bad" id="bad">Wrong password</div>
</form>
<script>if(location.search.includes("bad"))document.getElementById("bad").style.display="block"</script>
</body></html>
